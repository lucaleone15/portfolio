<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="color-scheme" content="light dark" />
  <title>Drapeau rouge · Luca Leone</title>
  <!-- Shown by the service worker (public/sw.js) when a page can't load without a
       connection. Standalone on purpose: no network, so nothing but this file and
       offline-game.js (both kept by the service worker). Inline styles only: the site's
       CSP allows them, not inline scripts. -->
  <style>
    :root {
      --bg: #f9f9fb;
      --ink: #111114;
      --muted: #5a5a63;
      --accent: #c50e36;
      --card: #ffffff;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a0a0c;
        --ink: #ffffff;
        --muted: #a1a1aa;
        --accent: #f23845;
        --card: #16161a;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); }
    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      padding: 32px 16px;
      font-family: "Plus Jakarta Sans Variable", "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }
    .flag {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 12px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent);
    }
    .flag::before { content: ""; width: 18px; height: 12px; border-radius: 2px; background: #e10600; }
    h1 { margin: 0; font-size: clamp(40px, 9vw, 72px); font-weight: 800; letter-spacing: -0.035em; line-height: 1.02; }
    h1 span { color: var(--accent); }
    p { margin: 0; max-width: 32em; font-size: clamp(15px, 2.2vw, 18px); line-height: 1.55; color: var(--muted); }
    .game { position: relative; width: min(380px, 100%); }
    canvas { display: block; width: 100%; height: auto; border-radius: 20px; background: #2c2c31; touch-action: none; cursor: pointer; box-shadow: 0 20px 50px -20px rgba(0,0,0,0.45); }
    .hud { display: flex; justify-content: space-between; width: min(380px, 100%); font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .hud em { font-style: normal; color: var(--muted); font-weight: 500; }
    .back {
      display: none; align-items: center; gap: 12px; padding: 10px 10px 10px 18px; border-radius: 999px;
      background: var(--card); box-shadow: 0 10px 30px -12px rgba(0,0,0,0.35); font-weight: 600; font-size: 15px;
    }
    .back.show { display: inline-flex; }
    button {
      font: inherit; font-weight: 700; border: 0; border-radius: 999px; padding: 11px 20px; cursor: pointer;
      background: var(--accent); color: #fff;
    }
    .sign { font-size: 13px; color: var(--muted); }
    .sign b { color: var(--ink); }
  </style>
</head>
<body>
  <span class="flag" id="flag">Drapeau rouge</span>
  <h1 id="title">Course neutralisée<span>.</span></h1>
  <p id="lead">Pas de connexion pour le moment. En attendant le retour du réseau, un petit tour de piste ? Évitez les cônes.</p>

  <div class="back" id="back" role="status">
    <span id="backText">La connexion est revenue.</span>
    <button type="button" id="resume">Reprendre la course</button>
  </div>

  <div class="hud" aria-live="polite">
    <span id="distance">0 m</span>
    <span><em id="bestLabel">Record</em> <span id="best">–</span></span>
  </div>
  <div class="game">
    <canvas id="track" width="380" height="520" aria-label="Mini-jeu de course"></canvas>
  </div>
  <p class="sign" id="hint">← → ou glisser le doigt · Espace ou toucher pour démarrer</p>
  <p class="sign"><b>Luca Leone</b> · luca-leone.ch</p>

  <script src="/offline-game.js" defer></script>
</body>
</html>
