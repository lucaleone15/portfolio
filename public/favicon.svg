<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Syne:wght@800&amp;display=swap');
      .syne-monogram {
        font-family: 'Syne', sans-serif;
        font-weight: 800;
        font-size: 38px;
        fill: #FFFFFF;
      }
    </style>
  </defs>

  <!-- Fond sombre #0A0A0C avec contours fins -->
  <rect width="64" height="64" rx="16" fill="#0A0A0C"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

  <!-- Lettre L en typographie Syne (ExtraBold) -->
  <text x="14" y="46" class="syne-monogram">L</text>

  <!-- Point signature vert fluo (#CCFF00) détaché et bien aéré sur la droite -->
  <circle cx="49" cy="42" r="4.5" fill="#CCFF00"/>
</svg>
