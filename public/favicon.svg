<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Fond sombre #0A0A0C avec contours fins -->
  <rect width="64" height="64" rx="16" fill="#0A0A0C"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>

  <!-- Premier L (en haut) tracé vectoriel géométrique précis -->
  <path d="M19 12 H26 V25 H37 V31 H19 Z" fill="#FFFFFF"/>

  <!-- Deuxième L (en bas, en dessous du premier L) -->
