<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Fond sombre #0A0A0C avec bordure subtile -->
  <rect width="64" height="64" rx="16" fill="#0A0A0C"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>

  <!-- Groupe monogramme LL en diagonale collés -->
  <!-- L de GAUCHE situé EN BAS -->
  <path d="M12 28 H20 V44 H34 V52 H12 Z" fill="#FFFFFF"/>

  <!-- L de DROITE situé EN HAUT (collé en diagonale contre celui de gauche) -->
  <path d="M26 12 H34 V28 H48 V36 H26 Z" fill="#FFFFFF"/>

  <!-- Point signature vert fluo (#CCFF00) aligné avec la barre du L de droite en haut -->
  <circle cx="54" cy="32" r="3.75" fill="#CCFF00"/>
</svg>
