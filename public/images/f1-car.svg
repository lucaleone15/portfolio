<svg xmlns="http://www.w3.org/2000/svg" width="200" height="560" viewBox="0 0 200 560">
  <!-- A modern Formula 1 car in Ferrari colours, seen from above, nose up. Drawn for the
       404 page (src/components/NotFound.tsx) and the offline game (public/offline-game.js).
       Generic: no team logos. Proportions of a current car (about 5.6 m by 2 m). -->
  <defs>
    <linearGradient id="red" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#8f0000"/>
      <stop offset="0.3" stop-color="#d40000"/>
      <stop offset="0.48" stop-color="#ff3b2f"/>
      <stop offset="0.52" stop-color="#ff3b2f"/>
      <stop offset="0.7" stop-color="#d40000"/>
      <stop offset="1" stop-color="#8f0000"/>
    </linearGradient>
    <linearGradient id="podL" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#7d0000"/>
      <stop offset="0.55" stop-color="#d00000"/>
      <stop offset="1" stop-color="#f02a1f"/>
    </linearGradient>
    <linearGradient id="podR" x1="1" x2="0" y1="0" y2="0">
      <stop offset="0" stop-color="#7d0000"/>
      <stop offset="0.55" stop-color="#d00000"/>
      <stop offset="1" stop-color="#f02a1f"/>
    </linearGradient>
    <linearGradient id="tyre" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0b0b0c"/>
      <stop offset="0.25" stop-color="#2a2a2d"/>
      <stop offset="0.5" stop-color="#3a3a3e"/>
      <stop offset="0.75" stop-color="#2a2a2d"/>
      <stop offset="1" stop-color="#0b0b0c"/>
    </linearGradient>
    <linearGradient id="carbon" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0e0e10"/>
      <stop offset="0.5" stop-color="#2b2b30"/>
      <stop offset="1" stop-color="#0e0e10"/>
    </linearGradient>
    <radialGradient id="helmet" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ff5a4e"/>
      <stop offset="1" stop-color="#b80000"/>
    </radialGradient>
  </defs>

  <!-- Floor: black, wider than the bodywork -->
  <path d="M100 150 C72 158 48 198 34 246 L18 300 C14 330 12 380 14 412 C16 448 30 470 48 482 L152 482 C170 470 184 448 186 412 C188 380 186 330 182 300 L166 246 C152 198 128 158 100 150 Z" fill="#141416"/>
  <path d="M20 300 C16 340 15 380 17 414" stroke="#3a3a3f" stroke-width="2" fill="none"/>
  <path d="M180 300 C184 340 185 380 183 414" stroke="#3a3a3f" stroke-width="2" fill="none"/>

  <!-- Suspension: wishbones to the wheel centres -->
  <g stroke="#0d0d0f" stroke-width="4" stroke-linecap="round">
    <path d="M86 122 L40 132 M86 158 L40 142 M87 140 L44 138"/>
    <path d="M114 122 L160 132 M114 158 L160 142 M113 140 L156 138"/>
    <path d="M74 424 L44 440 M74 466 L44 452"/>
    <path d="M126 424 L156 440 M126 466 L156 452"/>
  </g>

  <!-- Tyres, to scale: 72 cm across, 30 cm wide at the front, 40 cm at the rear -->
  <g>
    <rect x="22" y="100" width="30" height="72" rx="8" fill="url(#tyre)"/>
    <rect x="148" y="100" width="30" height="72" rx="8" fill="url(#tyre)"/>
    <rect x="14" y="410" width="40" height="72" rx="10" fill="url(#tyre)"/>
    <rect x="146" y="410" width="40" height="72" rx="10" fill="url(#tyre)"/>
    <g fill="#fff" opacity="0.07">
      <rect x="28" y="104" width="6" height="64" rx="3"/>
      <rect x="154" y="104" width="6" height="64" rx="3"/>
      <rect x="21" y="414" width="8" height="64" rx="4"/>
      <rect x="153" y="414" width="8" height="64" rx="4"/>
    </g>
  </g>

  <!-- Rear wing: endplates, main plane, flap -->
  <rect x="18" y="490" width="8" height="56" rx="3" fill="#121214"/>
  <rect x="174" y="490" width="8" height="56" rx="3" fill="#121214"/>
  <path d="M22 502 C60 496 140 496 178 502 L178 520 C140 514 60 514 22 520 Z" fill="url(#carbon)"/>
  <path d="M22 526 C60 520 140 520 178 526 L178 542 C140 536 60 536 22 542 Z" fill="#c80000"/>
  <path d="M24 528 C62 522 138 522 176 528" stroke="#fff" stroke-width="2" fill="none"/>
  <rect x="94" y="494" width="12" height="18" rx="3" fill="#0d0d0f"/>

  <!-- Front wing, under the nose: swept elements from the centre out to the endplates -->
  <rect x="6" y="38" width="7" height="42" rx="3" fill="#121214"/>
  <rect x="187" y="38" width="7" height="42" rx="3" fill="#121214"/>
  <path d="M10 66 C40 58 70 54 100 54 C130 54 160 58 190 66 L190 78 C160 71 130 68 100 68 C70 68 40 71 10 78 Z" fill="url(#carbon)"/>
  <path d="M12 58 C34 52 58 48 84 48 L84 55 C58 55 34 59 12 65 Z" fill="#d40000"/>
  <path d="M188 58 C166 52 142 48 116 48 L116 55 C142 55 166 59 188 65 Z" fill="#d40000"/>
  <path d="M12 48 C32 43 52 41 74 42 L74 48 C52 48 32 51 12 55 Z" fill="#b80000"/>
  <path d="M188 48 C168 43 148 41 126 42 L126 48 C148 48 168 51 188 55 Z" fill="#b80000"/>
  <path d="M12 58 C34 52 58 48 84 48" stroke="#fff" stroke-width="1.6" fill="none"/>
  <path d="M188 58 C166 52 142 48 116 48" stroke="#fff" stroke-width="1.6" fill="none"/>

  <!-- Sidepods, with the white accent line of the current livery -->
  <path d="M72 246 C54 248 34 258 28 282 L25 328 C25 360 36 382 52 398 C62 408 68 424 72 440 Z" fill="url(#podL)"/>
  <path d="M128 246 C146 248 166 258 172 282 L175 328 C175 360 164 382 148 398 C138 408 132 424 128 440 Z" fill="url(#podR)"/>
  <path d="M32 286 C36 266 52 256 70 254" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M168 286 C164 266 148 256 130 254" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M30 296 C30 330 34 356 46 376" stroke="#fff" stroke-opacity="0.35" stroke-width="1.5" fill="none"/>
  <path d="M170 296 C170 330 166 356 154 376" stroke="#fff" stroke-opacity="0.35" stroke-width="1.5" fill="none"/>
  <path d="M34 266 C44 256 58 252 72 251 L72 259 C60 260 48 264 40 272 Z" fill="#0b0b0d"/>
  <path d="M166 266 C156 256 142 252 128 251 L128 259 C140 260 152 264 160 272 Z" fill="#0b0b0d"/>

  <!-- Engine cover, down to the rear -->
  <path d="M100 214 C120 214 129 238 131 268 L133 330 C135 382 127 428 115 466 L108 500 L92 500 L85 466 C73 428 65 382 67 330 L69 268 C71 238 80 214 100 214 Z" fill="url(#red)"/>
  <path d="M100 330 L100 494" stroke="#7a0000" stroke-width="2.5"/>
  <path d="M100 330 L100 494" stroke="#fff" stroke-opacity="0.25" stroke-width="0.8"/>

  <!-- Monocoque and nose, on top of the front wing; the tip ends on the wing's main plane -->
  <path d="M100 30 C91 30 87 44 86 62 L82 138 C80 168 77 198 75 232 L125 232 C123 198 120 168 118 138 L114 62 C113 44 109 30 100 30 Z" fill="url(#red)"/>
  <path d="M100 44 L100 210" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M93 38 C95 30 105 30 107 38 L106 48 L94 48 Z" fill="#141416"/>

  <!-- Mirrors -->
  <g fill="#121214">
    <rect x="56" y="232" width="16" height="7" rx="3"/>
    <rect x="128" y="232" width="16" height="7" rx="3"/>
  </g>
  <path d="M72 236 L80 238 M128 236 L120 238" stroke="#121214" stroke-width="2"/>

  <!-- Cockpit, driver's helmet, halo -->
  <ellipse cx="100" cy="276" rx="15" ry="30" fill="#0b0b0d"/>
  <circle cx="100" cy="282" r="11.5" fill="url(#helmet)"/>
  <path d="M90 278 C94 270 106 270 110 278" stroke="#fff" stroke-width="2.4" fill="none"/>
  <path d="M93 288 C96 293 104 293 107 288" stroke="#f5c400" stroke-width="2" fill="none"/>
  <ellipse cx="100" cy="275" rx="7" ry="3" fill="#111"/>
  <ellipse cx="100" cy="276" rx="20" ry="33" fill="none" stroke="#1b1b1e" stroke-width="5"/>
  <path d="M100 243 L100 228" stroke="#1b1b1e" stroke-width="5" stroke-linecap="round"/>

  <!-- Airbox above the driver's head -->
  <path d="M92 316 C92 308 108 308 108 316 L106 330 L94 330 Z" fill="#0b0b0d"/>
</svg>
